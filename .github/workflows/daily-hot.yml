# 预留：每日自动抓取热榜并推送到 GitHub Gist
# 启用前需要：
# 1. 在仓库 Settings -> Secrets and variables -> Actions 中添加 GIST_TOKEN
# 2. 修改脚本中的 GIST_ID 为你自己的 Gist ID
# 3. 取消下面 schedule 的注释

name: Daily Hot Board Update

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *'  # 每天北京时间 10:00（UTC 2:00）

jobs:
  update-hot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch hot boards
        run: |
          mkdir -p hot-data
          curl -s "https://uapis.cn/api/v1/misc/hotboard?type=weibo" > hot-data/weibo.json
          curl -s "https://uapis.cn/api/v1/misc/hotboard?type=zhihu" > hot-data/zhihu.json
          curl -s "https://uapis.cn/api/v1/misc/hotboard?type=bilibili" > hot-data/bilibili.json
          curl -s "https://uapis.cn/api/v1/misc/hotboard?type=douyin" > hot-data/douyin.json
          curl -s "https://uapis.cn/api/v1/misc/hotboard?type=xiaohongshu" > hot-data/xiaohongshu.json

      - name: Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: your_gist_id_here
        run: |
          python3 << 'PY'
          import json, os, base64, urllib.request
          token = os.environ['GIST_TOKEN']
          gist_id = os.environ['GIST_ID']
          data = {}
          for src in ['weibo','zhihu','bilibili','douyin','xiaohongshu']:
              with open(f'hot-data/{src}.json') as f:
                  data[src] = json.load(f)
          content = json.dumps(data, ensure_ascii=False, indent=2)
          req = urllib.request.Request(
              f'https://api.github.com/gists/{gist_id}',
              data=json.dumps({
                  'files': {
                      'daily-hot.json': {'content': content}
                  }
              }).encode(),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json'
              },
              method='PATCH'
          )
          urllib.request.urlopen(req)
          PY
